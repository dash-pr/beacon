name: tasuke
description: "Beacon - Offline-first disaster P2P communication with on-device AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # P2P BLE Mesh - Dual Role
  flutter_blue_plus: ^1.31.0
  ble_peripheral: ^2.4.0

  # On-Device LLM (Gemma 3 1B)
  flutter_gemma: ^0.12.5

  # On-Device Vision AI
  google_mlkit_image_labeling: ^0.14.0
  google_mlkit_text_recognition: ^0.15.0

  # On-Device Translation
  google_mlkit_translation: ^0.13.1

  # Voice to Text (on-device)
  speech_to_text: ^7.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase (uncomment when google-services.json is added)
  # firebase_core: ^2.24.0
  # cloud_firestore: ^4.14.0
  # firebase_messaging: ^14.7.9

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Network + Connectivity
  connectivity_plus: ^5.0.2
  http: ^1.2.0

  # Location
  geolocator: ^11.0.0

  # Camera
  camera: ^0.10.5

  # XML parsing (J-Alert)
  xml: ^6.5.0

  # State Management
  provider: ^6.1.1

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/shelters/
    - assets/prompts/
